<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>申請書作成ツール＠(有)ムラオカ</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-title" content="申請書作成ツール＠(有)ムラオカ">
<meta name="application-name" content="申請書作成ツール＠(有)ムラオカ">
<meta name="theme-color" content="#f59e0b">
<style>
:root{
  --bg:#f4f6f9; --card:#ffffff; --ink:#1f2933; --muted:#667085; --line:#d9dee6; --field:#c3cad6;
  --accent:#1d5fd1; --accent-ink:#ffffff; --soft:#eaf1fd; --err:#c42b2b; --errsoft:#fdecec;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Yu Gothic UI","Yu Gothic","Meiryo","Hiragino Sans","Noto Sans JP",sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.6}
a{color:var(--accent)}
.hidden{display:none!important}

/* ---------- header ---------- */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--card);border-bottom:1px solid var(--line)}
.bar-in{max-width:900px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.brand{font-weight:700;font-size:17px;color:var(--ink);text-decoration:none;white-space:nowrap}
.office{flex:1;color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- layout ---------- */
.app{max-width:900px;margin:0 auto;padding:0 16px 120px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;margin-top:16px}
h1{font-size:22px;margin:0 0 8px}
.steps{margin:8px 0 0;padding-left:1.4em;color:var(--ink)}
.steps li{margin:4px 0}
.steps small{color:var(--muted)}
.search{margin-top:16px}
.cat h2{font-size:16px;margin:0 0 12px;display:flex;align-items:center;gap:8px}
.cat h2 .cnt{font-size:12px;color:var(--muted);font-weight:400}
.flist{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.fbtn{display:flex;align-items:center;gap:10px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;text-decoration:none;color:var(--ink);background:#fff;min-height:48px}
.fbtn:hover,.fbtn:focus-visible{border-color:var(--accent);background:var(--soft);outline:none}
.fbtn .no{font-size:12px;color:var(--muted);min-width:3.2em;font-variant-numeric:tabular-nums}
.empty{color:var(--muted);text-align:center;padding:24px}

/* ---------- form ---------- */
.fhead{margin-top:16px}
.back{display:inline-block;text-decoration:none;font-size:14px;padding:6px 0}
.fno{font-size:13px;color:var(--muted)}
.route{display:inline-block;padding:4px 10px;border-radius:8px;background:var(--soft);color:var(--accent);font-size:14px;font-weight:600}
.route-note{font-size:12px;color:var(--muted);margin-top:4px}
.ch{font-size:16px;margin:0 0 14px}
.ch small{font-weight:400;color:var(--muted);font-size:12px;margin-left:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:0 16px}
.sec{font-size:15px;color:var(--accent);margin:22px 0 14px;padding-bottom:6px;border-bottom:2px solid var(--soft)}
.sec:first-child{margin-top:0}
.field{margin-bottom:18px}
.lbl{display:block;font-weight:600;margin-bottom:6px;font-size:15px}
.req{display:inline-block;background:var(--errsoft);color:var(--err);font-size:11px;line-height:1.6;padding:0 6px;border-radius:4px;margin-left:8px;font-weight:700;vertical-align:2px}
.hint{font-size:13px;color:var(--muted);margin:-2px 0 6px}
input[type=text],input[type=search],input[type=date],input[type=time],input[type=datetime-local],input[type=month],input[type=number],select,textarea{
  width:100%;padding:9px 12px;border:1px solid var(--field);border-radius:8px;font:inherit;background:#fff;color:inherit;min-height:44px}
textarea{resize:vertical;line-height:1.6}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border:1px solid var(--field);border-radius:8px;cursor:pointer;background:#fff;min-height:44px}
.opt input{margin:0;width:18px;height:18px;accent-color:var(--accent)}
.opt:has(input:checked){border-color:var(--accent);background:var(--soft)}
.unit{display:flex;align-items:center;gap:8px}
.unit input{max-width:220px}
.range{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.range input{flex:1;min-width:140px;width:auto}
.calc{color:var(--accent);font-weight:600;font-size:14px}
.sumbox{font-size:20px;font-weight:700;color:var(--accent);padding:6px 0}
.tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.itbl{width:100%;border-collapse:collapse;min-width:560px}
.itbl th{font-size:12px;text-align:left;color:var(--muted);font-weight:600;padding:0 4px 4px}
.itbl td{padding:3px}
.itbl input,.itbl select{min-height:40px;padding:6px 8px;font-size:15px}
.itbl .ro{background:#f3f5f8;border-style:dashed}
.itbl .dc{width:40px;text-align:center}
.del{width:36px;height:36px;border:1px solid var(--line);background:#fff;border-radius:8px;cursor:pointer;color:var(--muted);font-size:18px;line-height:1}
.del:hover{color:var(--err);border-color:var(--err)}
.tfoot{display:flex;justify-content:space-between;align-items:center;margin-top:8px;gap:8px;flex-wrap:wrap}
.total{font-weight:700;color:var(--accent)}
.errmsg{display:none;color:var(--err);font-size:13px;margin-top:4px;font-weight:600}
.invalid .errmsg{display:block}
.invalid input,.invalid select,.invalid textarea,.invalid .opt{border-color:var(--err)}

/* ---------- buttons ---------- */
.btn{font:inherit;font-weight:600;border-radius:10px;padding:10px 18px;min-height:44px;cursor:pointer;border:1px solid var(--field);background:#fff;color:var(--ink)}
.btn:hover{background:#f6f7f9}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.sm{padding:6px 12px;min-height:36px;font-size:14px}
.btn.ghost{background:transparent}
.actions{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--card);border-top:1px solid var(--line);box-shadow:0 -4px 16px rgba(0,0,0,.05)}
.actions-in{max-width:900px;margin:0 auto;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));display:flex;justify-content:flex-end;gap:12px}

/* ---------- modal / toast ---------- */
.modal{position:fixed;inset:0;z-index:50;background:rgba(15,23,42,.45);display:flex;align-items:center;justify-content:center;padding:16px}
.mbox{background:var(--card);border-radius:14px;max-width:520px;width:100%;padding:22px;max-height:90vh;overflow:auto}
.mbox h2{margin:0 0 12px;font-size:18px}
.mbox ol{padding-left:1.3em;margin:8px 0}
.mbox li{margin:6px 0}
.fname{background:var(--soft);padding:8px 10px;border-radius:8px;font-size:14px;word-break:break-all}
.mfoot{display:flex;justify-content:flex-end;gap:10px;margin-top:18px;flex-wrap:wrap}
.chkline{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:14px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#1f2933;color:#fff;padding:10px 18px;border-radius:10px;z-index:60;font-size:14px}

@media (max-width:560px){
  .card{padding:16px}
  .actions-in .btn{flex:1}
}

/* ---------- print (PDF) ---------- */
#print{display:none}
@media print{
  @page{size:A4 portrait;margin:12mm 14mm 14mm}
  body{background:#fff}
  .bar,.app,.actions,.modal,.toast{display:none!important}
  #print{display:block;color:#000;font-family:"Yu Gothic","Yu Gothic UI","Meiryo","Hiragino Sans",sans-serif;font-size:10.5pt;line-height:1.5}
}
.p-top{display:flex;justify-content:space-between;font-size:9pt}
.p-title{text-align:center;font-size:18pt;letter-spacing:.25em;margin:3mm 0 1mm;font-weight:700}
.p-office{text-align:right;font-size:10.5pt;margin-bottom:3mm}
.p-stamp{display:flex;justify-content:flex-end;margin-bottom:3mm}
.p-stamp table{border-collapse:collapse}
.p-stamp th,.p-stamp td{border:.6pt solid #000;width:20mm;text-align:center;font-size:9pt;font-weight:400}
.p-stamp td{height:18mm}
table.p-ap,table.p-body{width:100%;border-collapse:collapse;table-layout:fixed}
.p-ap{margin-bottom:3mm}
.p-ap th,.p-ap td,.p-body th,.p-body td{border:.6pt solid #000;padding:1.6mm 2.2mm;vertical-align:top;text-align:left;word-break:break-all;overflow-wrap:anywhere}
.p-ap th,.p-body th{background:#efefef;font-weight:600;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.p-body tr{break-inside:avoid;page-break-inside:avoid}
.p-sec th{background:#d6d6d6!important}
.pre{white-space:pre-wrap}
.p-inner{width:100%;border-collapse:collapse;font-size:9.5pt}
.p-inner th,.p-inner td{border:.4pt solid #555;padding:1mm 1.5mm;background:#fff!important;font-weight:400}
.p-inner thead th{background:#f5f5f5!important;font-weight:600}
.p-inner .r{text-align:right}
.p-inner .tot td{font-weight:700}
.p-foot{margin-top:4mm;font-size:8pt;color:#333;display:flex;justify-content:space-between;gap:4mm}

/* ---------- お便りの共通部分 ---------- */
.commonbox{border:1px dashed var(--field);border-radius:10px;padding:14px;background:var(--soft)}
.cmonth{font-size:20px;font-weight:700;color:var(--accent);margin-top:10px}
.cwarn{color:var(--err);font-weight:600;font-size:14px;margin-top:4px}
.cempty{color:var(--muted);font-size:14px;margin-top:8px}
.cdl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:8px 0 0;font-size:14px}
.cdl dt{color:var(--muted)}
.cdl dd{margin:0;min-width:0;overflow-wrap:anywhere}

/* ---------- 写真 ---------- */
input[type=file]{font:inherit;max-width:100%}
.phlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin-top:8px}
.ph{position:relative}
.ph img{display:block;width:100%;max-width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.phdel{position:absolute;top:4px;right:4px;width:32px;height:32px;border-radius:50%;border:none;background:rgba(0,0,0,.6);color:#fff;font-size:18px;line-height:1;cursor:pointer}

/* ---------- お便り（手紙形式） ---------- */
.letter{font-size:11pt;line-height:1.85;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.l-date{text-align:right}
.l-to{font-size:13pt;margin-top:4mm;display:inline-block;border-bottom:.6pt solid #000;padding:0 8mm .5mm 0}
.l-from{text-align:right;margin-top:2mm;font-size:10.5pt;line-height:1.6}
.l-title{text-align:center;font-size:17pt;font-weight:700;letter-spacing:.15em;margin:6mm 0 5mm}
.l-p{margin:0 0 3mm;text-indent:1em;white-space:pre-wrap}
.l-sec{margin:0 0 4mm;break-inside:avoid;page-break-inside:avoid}
.l-sec h3{font-size:11.5pt;margin:0 0 1mm;padding-left:2.5mm;border-left:1.2mm solid #6b7280}
.l-sec .pre{padding-left:3.7mm}
.l-photos{display:grid;grid-template-columns:1fr 1fr;gap:3mm;margin:1mm 0 5mm;break-inside:avoid;page-break-inside:avoid}
.l-photos img{width:100%;height:58mm;object-fit:cover;border-radius:2mm}
.l-photos.n1{grid-template-columns:1fr;justify-items:center}
.l-photos.n1 img{width:auto;max-width:75%;height:auto;max-height:85mm;object-fit:contain}

/* ---------- お便り（たより・紙面形式 v2） ---------- */
.nl{--lh:8.6mm;--ink:#333;font-size:11.5pt;color:#222;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.nl *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
.pop{font-family:"HGS創英角ﾎﾟｯﾌﾟ体","HG創英角ﾎﾟｯﾌﾟ体","HGP創英角ﾎﾟｯﾌﾟ体","Yu Gothic","Meiryo",sans-serif;font-weight:700}
.nl-head{position:relative;height:56mm}
.nl-dt{position:absolute;right:0;top:0;text-align:right;font-size:10pt;line-height:1.5;font-family:"Yu Mincho","MS Mincho",serif}
.nl-oval{position:absolute;left:6mm;right:6mm;top:5mm;bottom:0;border:.45mm solid var(--ink);border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1mm}
.nl-logo{height:38mm;width:auto}
.nl-unit{font-size:18pt;color:#333;letter-spacing:.06em;line-height:1.1}
.nl-mid{display:grid;grid-template-columns:1fr 1fr;gap:6mm;margin-top:5mm;align-items:start;break-inside:avoid;page-break-inside:avoid}
.nl-lbl{font-size:14pt;margin:0 0 1.5mm 3mm;letter-spacing:.06em}
.nl-box{border:.4mm solid var(--ink);border-radius:5mm;padding:3.5mm 5mm}
.nl-mon{font-size:13pt;margin-bottom:1mm}
.nl-sched{margin:0;padding:0 0 0 14mm;list-style:none;line-height:1.75}
.nl-level{margin-top:3mm;font-size:12pt;text-align:center}
.nl-level b{color:#dc2626;font-size:19pt;font-weight:400;margin:0 1.5mm;font-family:"Yu Mincho","MS Mincho",serif}
.nl-ill{display:flex;justify-content:center;align-items:center;gap:5mm;margin-top:4mm}
.nl-ill img{max-width:46%;max-height:30mm;object-fit:contain}
.nl-greet{border-radius:7mm;padding:2mm 4.5mm 3mm}
.ruled{line-height:var(--lh);white-space:pre-wrap;overflow-wrap:anywhere;background-color:#fff;
  background-image:linear-gradient(to right,#fff 50%,rgba(255,255,255,0) 50%),linear-gradient(to bottom,rgba(0,0,0,0) calc(100% - .45mm),#777 calc(100% - .45mm),#777 calc(100% - .15mm),rgba(0,0,0,0) calc(100% - .15mm));
  background-size:1.6mm 100%,100% var(--lh)}
.nl-greet .ruled{font-size:12.5pt;letter-spacing:.03em}
.nl-user{margin-top:5mm;break-inside:avoid;page-break-inside:avoid}
.nl-user .nl-lbl{margin-left:3mm;font-family:inherit;font-weight:400;font-size:12pt}
.nl-to{margin:0 0 0 40mm;font-size:13pt}
.nl-to span{display:inline-block;min-width:30mm}
.nl-user .ruled{min-height:calc(var(--lh) * 6);margin:0 4mm;font-size:12pt}
.nl-user .ruled .hd{font-weight:700}
.nl-tanto{text-align:right;margin:4mm 6mm 0 0;font-size:11.5pt}
.nl-tanto span{display:inline-block;min-width:28mm;text-align:left;margin-left:3mm}
.nl-photos{display:flex;justify-content:center;gap:5mm;margin:4mm 0 0;break-inside:avoid;page-break-inside:avoid}
.nl-photos img{max-width:48%;max-height:62mm;object-fit:contain;border-radius:2mm}
.nl-extra{margin-top:6mm;break-inside:avoid;page-break-inside:avoid}
.nl-extra .nl-box{white-space:pre-wrap;line-height:1.8}
.l-end{text-align:right;margin-top:4mm}
</style>
</head>
<body>

<header class="bar">
  <div class="bar-in">
    <a href="#" class="brand">申請書作成ツール</a>
    <span class="office" id="officeLbl"></span>
    <button type="button" class="btn sm" id="openSettings">設定</button>
  </div>
</header>

<main class="app" id="view"></main>

<div class="actions hidden" id="actions">
  <div class="actions-in">
    <button type="button" class="btn" id="btnClear">入力をクリア</button>
    <button type="button" class="btn primary" id="btnPdf">PDFを作成</button>
  </div>
</div>

<div id="print"></div>

<!-- 設定 -->
<div class="modal hidden" id="mSettings" role="dialog" aria-modal="true" aria-labelledby="mSetT">
  <div class="mbox">
    <h2 id="mSetT">設定</h2>
    <div class="field">
      <label class="lbl" for="sOffice">事業所名（帳票に印字）</label>
      <input type="text" id="sOffice" placeholder="例：グループホーム〇〇">
    </div>
    <label class="chkline"><input type="checkbox" id="sStamp"> 帳票に承認印欄を表示する</label>
    <div class="field" style="margin-top:10px">
      <label class="lbl" for="sStampLabels">承認印欄の見出し（カンマ区切り）</label>
      <input type="text" id="sStampLabels" placeholder="例：施設長,管理者">
      <div class="hint">ケアコネで承認する場合は、通常は表示しなくて構いません。</div>
    </div>
    <label class="chkline"><input type="checkbox" id="sGuide"> PDF作成時に保存方法の案内を表示する</label>
    <div class="mfoot">
      <button type="button" class="btn" data-close="mSettings">キャンセル</button>
      <button type="button" class="btn primary" id="saveSettings">保存</button>
    </div>
  </div>
</div>

<!-- 確認 -->
<div class="modal hidden" id="mPin" role="dialog" aria-modal="true" aria-labelledby="pinT">
  <div class="mbox">
    <h2 id="pinT">管理者の暗証番号</h2>
    <p id="pinMsg" style="margin:0 0 8px">このページは管理者専用です。暗証番号を入れてください。</p>
    <input type="password" id="pinIn" inputmode="numeric" autocomplete="off" aria-label="暗証番号">
    <div class="mfoot">
      <button type="button" class="btn" id="pinNo">キャンセル</button>
      <button type="button" class="btn primary" id="pinYes">開く</button>
    </div>
  </div>
</div>
<div class="modal hidden" id="mConfirm" role="dialog" aria-modal="true" aria-labelledby="cMsg">
  <div class="mbox">
    <p id="cMsg" style="margin:0"></p>
    <div class="mfoot">
      <button type="button" class="btn" id="cNo">キャンセル</button>
      <button type="button" class="btn primary" id="cYes">OK</button>
    </div>
  </div>
</div>

<!-- PDF保存の案内 -->
<div class="modal hidden" id="mGuide" role="dialog" aria-modal="true" aria-labelledby="mGuideT">
  <div class="mbox">
    <h2 id="mGuideT">PDFの保存方法</h2>
    <p style="margin:0">次の画面（印刷画面）で、以下のように操作してください。</p>
    <ol>
      <li id="gStep1">「送信先」または「プリンター」で <b>「PDFに保存」</b>（Edgeでは「PDFとして保存」）を選ぶ</li>
      <li id="gStep2"><b>「保存」</b>を押す（通常は「ダウンロード」フォルダに保存されます）</li>
      <li id="gStep3">保存したPDFをケアコネに送信し、その投稿から承認申請する</li>
    </ol>
    <div style="font-size:13px;color:var(--muted)">保存されるファイル名</div>
    <div class="fname" id="gName"></div>
    <label class="chkline"><input type="checkbox" id="gHide"> 次回から表示しない</label>
    <div class="mfoot">
      <button type="button" class="btn" data-close="mGuide">戻る</button>
      <button type="button" class="btn primary" id="gGo">印刷画面を開く</button>
    </div>
  </div>
</div>

<script>
/* =========================================================
   管理者向け設定
   OFFICE_NAME に事業所名を入れて配布すると、全員の帳票に反映されます。
   （各自の「設定」で入力した名前がある場合はそちらが優先されます）
   ========================================================= */
const OFFICE_NAME = '';
// お便りの予定・ご挨拶を保存するGoogleドライブのスクリプトのURL（空欄なら事務所PCのサーバーを使う）
const CLOUD_URL = 'https://script.google.com/macros/s/AKfycbyNaouwriIBxm27PYeqea5k_ToTX1Lyh9EzvoaiU3J_Ly-JdIgaw8-x_NGU7nBcBj6QJw/exec';

const pad = n => String(n).padStart(2,'0');

  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
const WD = '日月火水木金土';
function fmtDate(s, short){
  if(!/^\d{4}-\d{2}-\d{2}$/.test(s||'')) return s || '';
  const [y,m,dd] = s.split('-').map(Number);
  const w = WD[new Date(y, m-1, dd).getDay()];
  return short ? `${y}/${m}/${dd}(${w})` : `${y}年${m}月${dd}日（${w}）`;
}
function fmtMonth(s){ const m = /^(\d{4})-(\d{2})$/.exec(s||''); return m ? `${m[1]}年${Number(m[2])}月` : (s||''); }
function fmtDT(s){ if(!s) return ''; const [a,b] = s.split('T'); return fmtDate(a) + (b ? ' ' + b.slice(0,5) : ''); }
const yenStr = n => Number(n).toLocaleString('ja-JP') + '円';
const toNum = v => { const n = parseFloat(String(v).replace(/,/g,'')); return isNaN(n) ? null : n; };
function daysOf(a, b){
  if(!a) return null;
  const s = new Date(a + 'T00:00:00'), e = new Date((b || a) + 'T00:00:00');
  const n = Math.round((e - s) / 864e5) + 1;
  return n >= 1 ? n : null;
}
function minsOf(a, b){
  if(!a || !b) return null;
  const [h1,m1] = a.split(':').map(Number), [h2,m2] = b.split(':').map(Number);
  let m = (h2*60+m2) - (h1*60+m1); if(m < 0) m += 1440;
  return m;
}
const hm = m => `${Math.floor(m/60)}時間${m%60 ? (m%60)+'分' : ''}`;
function toast(msg, ms){
  const el = document.createElement('div'); el.className = 'toast'; el.textContent = msg;
  document.body.appendChild(el); setTimeout(() => el.remove(), ms || 2600);
}

    $('#cYes').focus();
  });
}

/* ---------- お便りの予定・挨拶の保存先 ----------
   cloud：Googleドライブ（CLOUD_URL のスクリプト）。どこからでも使える
          スタッフは合言葉で読み込み、管理者は暗証番号で保存する（管理者ページは一覧に出さない）
   lan  ：事務所PCのサーバー（start-server_v2.bat）。管理者ページは事務所PCだけに表示 */
const BACKEND = CLOUD_URL ? 'cloud' : (/^https?:$/.test(location.protocol) ? 'lan' : '');
const ON_SERVER = !!BACKEND;
let IS_ADMIN = location.protocol === 'file:' && !CLOUD_URL;
let PIN_NEEDED = BACKEND === 'cloud', PIN = '';
async function checkServer(){
  if(BACKEND !== 'lan') return;
  try{ const j = await (await fetch('/api/admin', {cache:'no-store'})).json(); IS_ADMIN = !!j.admin; PIN_NEEDED = !!j.pin; }catch(e){}
}
async function cloud(body){
  try{
    const r = await fetch(CLOUD_URL, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(body)});
    return await r.json();
  }catch(e){ return {ok:false, error:'net'}; }
}
async function ensureStaffKey(force){
  let k = force ? '' : LS.get('shinsei.staffKey', '');
  if(!k){
    k = await askPin('スタッフの合言葉', '予定・ご挨拶を読み込むための合言葉を入れてください（このスマホでは最初の1回だけです）', 'text');
    if(k) LS.set('shinsei.staffKey', k);
  }
  return k;
}
// スタッフ用の読み込み（合言葉が違えば聞き直す）
async function cloudRead(action, extra){
  let key = PIN ? '' : await ensureStaffKey();
  if(!key && !PIN) return null;
  let j = await cloud(Object.assign({action, key, pin:PIN}, extra));
  if(j.error === 'denied' && !PIN){
    LS.set('shinsei.staffKey', '');
    toast('合言葉が違います', 3000);
    key = await ensureStaffKey(true);
    if(!key) return null;
    j = await cloud(Object.assign({action, key, pin:PIN}, extra));
  }
  if(j.error === 'locked') toast('まちがいが続いたため、10分ほど使えません。時間をおいてください', 5000);
  else if(j.error === 'net') toast('インターネットにつながっていないため、予定・ご挨拶を読み込めませんでした', 5000);
  return j.ok ? j : null;
}

async function apiList(){
  if(BACKEND === 'cloud'){ const j = await cloudRead('list'); return j ? j.months : null; }
  try{ return await (await fetch('/api/common/list', {cache:'no-store'})).json(); }catch(e){ return null; }
}
// 1か月分の予定・ご挨拶
async function apiGet(m){
  if(BACKEND === 'cloud'){ const j = await cloudRead('get', {month:m}); return j ? j.data : null; }
  try{ const r = await fetch('/api/common?m=' + encodeURIComponent(m), {cache:'no-store'}); return r.ok ? await r.json() : null; }catch(e){ return null; }
}
// 保存（結果：'ok' / 'denied' / 'locked' / 'net'）
async function apiSave(m, data){
  if(BACKEND === 'cloud'){
    const j = await cloud({action:'save', pin:PIN, month:m, data});
    return j.ok ? 'ok' : (j.error || 'net');
  }
  try{
    const r = await fetch('/api/common?m=' + encodeURIComponent(m), {method:'POST', headers:{'Content-Type':'application/json', 'X-Pin':PIN}, body:JSON.stringify(data)});
    return r.ok ? 'ok' : (r.status === 403 ? 'denied' : 'net');
  }catch(e){ return 'net'; }
}
function askPin(title, msg, kind){
  return new Promise(res => {
    const m = $('#mPin');
    $('#pinT').textContent = title || '管理者の暗証番号';
    $('#pinMsg').textContent = msg || 'このページは管理者専用です。暗証番号を入れてください。';
    // 合言葉（かな入力あり）と暗証番号（数字）で入力欄を毎回作り直す
    // （パスワード欄を使い回すと、Androidでかな入力ができなくなるため）
    const inp = document.createElement('input');
    inp.id = 'pinIn'; inp.autocomplete = 'off';
    if(kind === 'text'){ inp.type = 'text'; inp.lang = 'ja'; inp.setAttribute('autocapitalize', 'off'); inp.setAttribute('aria-label', '合言葉'); }
    else { inp.type = 'password'; inp.inputMode = 'numeric'; inp.setAttribute('aria-label', '暗証番号'); }
    $('#pinIn').replaceWith(inp);
    const done = v => { m.classList.add('hidden'); $('#pinYes').onclick = $('#pinNo').onclick = null; res(v); };
    $('#pinYes').onclick = () => done(inp.value.trim());
    $('#pinNo').onclick = () => done('');
    // かな変換を確定するEnterでは閉じない
    inp.onkeydown = e => { if(e.key === 'Enter' && !e.isComposing && e.keyCode !== 229) done(inp.value.trim()); };
    m.classList.remove('hidden');
    inp.focus();
  });
}
async function unlockAdmin(){
  if(!ON_SERVER || !PIN_NEEDED || PIN) return true;
  const p = await askPin();
  if(!p) return false;
  if(BACKEND === 'cloud'){
    const j = await cloud({action:'check', pin:p});
    if(j.ok && j.admin){ PIN = p; IS_ADMIN = true; return true; }
    toast(j.error === 'locked' ? 'まちがいが続いたため、10分ほど使えません' : j.error === 'net' ? 'インターネットにつながっていません' : '暗証番号が違います', 3000);
    return false;
  }
  try{
    const r = await fetch('/api/pin', {method:'POST', headers:{'X-Pin':p}});
    if(r.ok){ PIN = p; return true; }
  }catch(e){}
  toast('暗証番号が違います', 3000);
  return false;
}

      const fs = c.forms.filter(f => (IS_ADMIN || !f.saveCommon) && (!q || f.title.includes(q) || String(f.no) === q));
      if(!fs.length) return;
      html += `<section class="card cat"><h2>${esc(c.name)} <span class="cnt">${fs.length}種類</span></h2><div class="flist">` +
        fs.map(f => `<a class="fbtn" href="#${f.id}"><span class="no">No.${f.no}</span><span>${esc(f.title)}</span></a>`).join('') +
        `</div></section>`;
    });
    $('#list').innerHTML = html || '<div class="card empty">該当する帳票がありません</div>';
  };
  $('#q').addEventListener('input', draw);
  draw();
  window.scrollTo(0, 0);
}

function fieldHTML(f){
  if(f.type === 'h') return `<h3 class="sec">${esc(f.label)}</h3>`;
  const nm = 'fld-' + f.id;
  const req = f.req ? '<span class="req">必須</span>' : '';
  const hint = f.hint ? `<div class="hint">${esc(f.hint)}</div>` : '';
  const ph = f.ph ? ` placeholder="${esc(f.ph)}"` : '';
  let ctl = '', forId = nm;
  switch(f.type){
    case 'text': ctl = `<input type="text" id="${nm}"${ph}>`; break;
    case 'textarea': ctl = `<textarea id="${nm}" rows="${f.rows||4}"${ph}></textarea>`; break;
    case 'date': ctl = `<input type="date" id="${nm}">`; break;
    case 'time': ctl = `<input type="time" id="${nm}">`; break;
    case 'datetime': ctl = `<input type="datetime-local" id="${nm}">`; break;
    case 'month': ctl = `<input type="month" id="${nm}" placeholder="例：2026-12">`; break;
    case 'number': ctl = `<div class="unit"><input type="number" id="${nm}" min="0" step="any" inputmode="decimal"><span>${esc(f.unit||'')}</span></div>`; break;
    case 'yen': ctl = `<div class="unit"><input type="number" id="${nm}" min="0" step="1" inputmode="numeric"><span>円</span></div>`; break;
    case 'select': ctl = `<select id="${nm}"><option value="">選択してください</option>${f.opts.map(o => `<option>${esc(o)}</option>`).join('')}</select>`; break;
    case 'radio': case 'checks': {
      const tp = f.type === 'radio' ? 'radio' : 'checkbox';
      ctl = `<div class="opts" role="group" aria-label="${esc(f.label)}">${f.opts.map(o => `<label class="opt"><input type="${tp}" name="${nm}" value="${esc(o)}"><span>${esc(o)}</span></label>`).join('')}</div>`;
      forId = null; break;
    }
    case 'drange':
      ctl = `<div class="range"><input type="date" id="${nm}-a" aria-label="${esc(f.label)}（開始）"><span>〜</span><input type="date" id="${nm}-b" aria-label="${esc(f.label)}（終了）"><span class="calc" id="${nm}-c"></span></div>`;
      forId = nm + '-a'; break;
    case 'trange':
      ctl = `<div class="range"><input type="time" id="${nm}-a" aria-label="${esc(f.label)}（開始）"><span>〜</span><input type="time" id="${nm}-b" aria-label="${esc(f.label)}（終了）"><span class="calc" id="${nm}-c"></span></div>`;
      forId = nm + '-a'; break;
    case 'table':
      ctl = `<div class="tblwrap"><table class="itbl" id="${nm}"><thead><tr>${f.cols.map(c => `<th${c.w ? ` style="width:${c.w}"` : ''}>${esc(c.label)}</th>`).join('')}<th class="dc"></th></tr></thead><tbody></tbody></table></div>
        <div class="tfoot"><button type="button" class="btn sm addrow" data-t="${f.id}">＋ 行を追加</button><span class="total" id="${nm}-total"></span></div>`;
      forId = null; break;
    case 'sum': ctl = `<div class="sumbox" id="${nm}">0円</div>`; forId = null; break;
    case 'photos': ctl = `<input type="file" id="${nm}" accept="image/jpeg,image/png" multiple><div class="phlist" id="${nm}-list"></div>`; break;
    case 'common':
      if(ON_SERVER){
        ctl = `<div class="commonbox"><select id="commonMonth" aria-label="対象月"><option value="">読み込み中…</option></select>` +
          (current && current.saveCommon ? ` <button type="button" class="btn" id="openCommonMonth">この月を開く</button>` : '') +
          `<div id="commonInfo"></div></div>`;
      } else {
        ctl = `<div class="commonbox"><button type="button" class="btn" id="loadCommon">共通部分のファイルを選ぶ</button><input type="file" id="commonFile" accept=".json,application/json" hidden><div id="commonInfo"></div></div>`;
      }
      forId = null; break;
  }
  if(f.type === 'common' && ON_SERVER){
    const h2 = current && current.saveCommon ? '保存済みの月を直すときは、月を選んで「この月を開く」を押してください'
      : '管理者が入力した予定・ご挨拶が自動で入ります。お便りの月が違うときは選び直してください';
    return `<div class="field" data-fid="${f.id}"><div class="lbl">${esc(f.label)}${req}</div><div class="hint">${esc(h2)}</div>${ctl}<div class="errmsg">管理者が予定・ご挨拶を入力するまでお待ちください</div></div>`;
  }
  const lbl = forId ? `<label class="lbl" for="${forId}">${esc(f.label)}${req}</label>` : `<div class="lbl">${esc(f.label)}${req}</div>`;
  return `<div class="field" data-fid="${f.id}">${lbl}${hint}${ctl}<div class="errmsg">入力してください</div></div>`;

function cellHTML(c){
  const a = `data-col="${c.id}" aria-label="${esc(c.label)}"`;
  if(c.calc) return `<input type="text" ${a} class="ro" readonly tabindex="-1">`;
  switch(c.type){
    case 'date': return `<input type="date" ${a}>`;
    case 'number': return `<input type="number" min="0" step="any" inputmode="decimal" ${a}>`;
    case 'yen': return `<input type="number" min="0" step="1" inputmode="numeric" ${a}>`;
    case 'select': return `<select ${a}><option value=""></option>${c.opts.map(o => `<option>${esc(o)}</option>`).join('')}</select>`;
    default: return `<input type="text" ${a}>`;
  }
}
function addRow(f){
  const tb = document.querySelector(`#fld-${f.id} tbody`);
  const row = document.createElement('tr');
  row.innerHTML = f.cols.map(c => `<td>${cellHTML(c)}</td>`).join('') + `<td class="dc"><button type="button" class="del" aria-label="この行を削除">×</button></td>`;
  tb.appendChild(row);
}

let PHOTOS = {};
function loadImage(file){
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => {
      const img = new Image();
      img.onload = () => {
        const s = Math.min(1, 1400 / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        res(c.toDataURL('image/jpeg', 0.85));
      };
      img.onerror = rej; img.src = r.result;
    };
    r.onerror = rej; r.readAsDataURL(file);
  });
}
function renderPhotos(f){
  const list = PHOTOS[f.id] || [];
  document.getElementById(`fld-${f.id}-list`).innerHTML = list.map((src, i) =>
    `<div class="ph"><img src="${src}" alt="写真${i+1}"><button type="button" class="phdel" data-ph="${f.id}" data-i="${i}" aria-label="写真${i+1}を削除">×</button></div>`).join('');
}
async function addPhotos(inp){
  const f = current.fields.find(x => 'fld-' + x.id === inp.id);
  const list = PHOTOS[f.id] || (PHOTOS[f.id] = []);
  let over = false, bad = false;
  for(const file of [...inp.files]){
    if(list.length >= f.max){ over = true; break; }
    try{ list.push(await loadImage(file)); }catch(e){ bad = true; }
  }
  inp.value = '';
  if(bad) toast('読み込めない写真がありました。JPEGかPNGの写真を選んでください。', 4000);
  else if(over) toast(`写真は${f.max}枚までです`);
  dirty = true; renderPhotos(f); update();
}

/* ---------- お便りの共通部分（管理者が保存 → スタッフが読み込む） ---------- */
let COMMON = null;   // スタッフが読み込んだ共通部分（画面を閉じるまで保持）
const COMMON_KEYS = ['month','title','issue','schedule','level','season','greet','event','next','notice','closing'];
const COMMON_PHOTOS = ['illust','eventPhotos'];
const cut = s => !s ? '—' : (s.length > 60 ? s.slice(0, 60) + '…' : s);
function renderCommon(){
  const box = document.getElementById('commonInfo');

async function loadCommon(inp){
  const file = inp.files[0]; inp.value = '';
  if(!file) return;
  let data = null;
  try{ data = JSON.parse(await file.text()); }catch(e){}
  if(!data || data.kind !== 'otayori-common'){
    toast('お便りの共通部分のファイルではありません。ファイルを確認してください。', 4000);
    return;

  applyCommon(data);
}
// 事務所PCのサーバーから、保存済みの月の一覧を取ってきて選択欄に入れる
async function initServerCommon(){
  const sel = document.getElementById('commonMonth');
  if(!ON_SERVER || !sel) return;
  sel.innerHTML = '<option value="">読み込み中…</option>';
  let months = await apiList();
  if(months === null){ sel.innerHTML = '<option value="">（読み込めませんでした）</option>'; return; }
  if(!Array.isArray(months)) months = [];
  if(!months.length){
    sel.innerHTML = '<option value="">（保存された月はありません）</option>';
    renderCommon();
    return;
  }
  sel.innerHTML = months.map(m => `<option value="${esc(m)}">${esc(fmtMonth(m))}分</option>`).join('');
  if(current.letter){
    // 来月分があれば来月分、なければ保存されている中でいちばん新しい月
    const d = new Date(), nx = new Date(d.getFullYear(), d.getMonth() + 1, 1);
    const want = `${nx.getFullYear()}-${pad(nx.getMonth() + 1)}`, cur = `${d.getFullYear()}-${pad(d.getMonth() + 1)}`;
    sel.value = months.includes(want) ? want : months.includes(cur) ? cur : months[0];
    await loadServerCommon(sel.value, true);
  }
}
async function loadServerCommon(m, quiet){
  if(!m) return;
  const data = await apiGet(m);
  if(!data || data.kind !== 'otayori-common'){
    if(BACKEND === 'lan') toast('予定・ご挨拶を読み込めませんでした。事務所のパソコンが起動しているか確認してください。', 5000);
    return;
  }
  applyCommon(data, quiet);
}
function applyCommon(data, quiet){
  if(current.saveCommon){
    COMMON_KEYS.forEach(k => {
      const el = document.getElementById('fld-' + k);
      if(el){ el.value = data[k] || ''; if(data[k]) el.dataset.edited = '1'; }
    });
    COMMON_PHOTOS.forEach(k => {
      PHOTOS[k] = (data[k] || []).slice();
      renderPhotos(current.fields.find(x => x.id === k));
    });
    document.getElementById('commonInfo').innerHTML = `<div class="cmonth">${esc(fmtMonth(data.month))}分を読み込みました</div>`;
    dirty = true;
    toast(`読み込みました。直したら「${ON_SERVER ? '保存する' : '共通部分を保存'}」で保存し直してください`, 4000);
  } else {
    COMMON = data;
    renderCommon();
    const box = document.querySelector('.field[data-fid="common"]'); if(box) box.classList.remove('invalid');
    if(!quiet) toast(`${fmtMonth(data.month)}分の予定・ご挨拶を読み込みました`);
  }
  update();
}
async function saveCommon(){
  update();
  if(!validate()) return;
  if(IN_FRAME){ toast('この画面は確認用のため、保存できません。配布用のファイルを開いて保存してください。', 5000); return; }
  const v = vals, data = {kind:'otayori-common', version:1};
  COMMON_KEYS.forEach(k => { data[k] = v[k] || ''; });
  COMMON_PHOTOS.forEach(k => { data[k] = v[k] || []; });
  data.author = readAp().name; data.createdAt = new Date().toISOString();
  if(ON_SERVER){
    toast('保存しています…', 2000);
    const res = await apiSave(v.month, data);
    if(res === 'ok'){
      dirty = false;
      toast(`${fmtMonth(v.month)}分を保存しました。スタッフのお便りに自動で入ります`, 5000);
      initServerCommon();
    } else if(res === 'locked'){
      toast('まちがいが続いたため、10分ほど保存できません。時間をおいてください', 6000);
    } else if(res === 'denied'){
      toast(BACKEND === 'cloud' ? '保存できませんでした。暗証番号が変わった場合は、ページを開き直してください'
        : '保存できませんでした。事務所のパソコンで「http://localhost:8765/」から開いてください（暗証番号が変わった場合は開き直してください）', 7000);
    } else {
      toast(BACKEND === 'cloud' ? '保存できませんでした。インターネットにつながっているか確認してください'
        : '保存できませんでした。事務所のパソコンのサーバー（start-server_v2.bat）が起動しているか確認してください', 6000);
    }
    return;
  }
  const m = /^(\d{4})-(\d{2})$/.exec(v.month || '');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(data)], {type:'application/json'}));
  a.download = `${m ? m[1] + '年' + Number(m[2]) + '月' : ''}_お便り共通.json`;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  dirty = false;
  toast(`「${a.download}」を保存しました。ダウンロードフォルダから共有フォルダへ移してください`, 6000);
}

function readValue(f){
  const nm = 'fld-' + f.id;
  const v = id => { const el = document.getElementById(id); return el ? el.value.trim() : ''; };
  switch(f.type){
    case 'radio': { const c = document.querySelector(`input[name="${nm}"]:checked`); return c ? c.value : ''; }
    case 'checks': return $$(`input[name="${nm}"]:checked`).map(x => x.value);
    case 'drange': case 'trange': return [v(nm+'-a'), v(nm+'-b')];
    case 'table':
      return $$(`#${nm} tbody tr`).map(row => {
        const r = {};
        f.cols.forEach(c => { const el = row.querySelector(`[data-col="${c.id}"]`); r[c.id] = el ? el.value.trim() : ''; });
        return r;
      }).filter(r => f.cols.some(c => !c.calc && r[c.id] !== ''));
    case 'sum': return null;
    case 'photos': return (PHOTOS[f.id] || []).slice();
    case 'common': return current.letter ? COMMON : null;
    default: return v(nm);
  }
}
const readAp = () => ({date:$('#ap-date').value, dept:$('#ap-dept').value.trim(), role:$('#ap-role').value.trim(), name:$('#ap-name').value.trim()});

function isShown(f){
  if(!f.showIf) return true;
  const v = vals[f.showIf.f];
  return Array.isArray(v) ? v.some(x => f.showIf.v.includes(x)) : f.showIf.v.includes(v);
}
function isEmpty(f, v){
  if(f.type === 'drange' || f.type === 'trange') return !v[0];
  if(Array.isArray(v)) return v.length === 0;
  return v === '' || v == null;
}
const tableTotal = (f, rows) => rows.reduce((s, r) => s + (toNum(r[f.total]) || 0), 0);
function sumOf(f){
  return f.parts.reduce((s, id) => {
    const p = current.fields.find(x => x.id === id);
    if(!p) return s;
    if(p.type === 'table') return s + tableTotal(p, vals[id] || []);
    return s + (toNum(vals[id]) || 0);
  }, 0);
}

function update(){
  if(!current) return;
  // 対象月などから自動で入る項目（本人が書き換えた場合はそのまま）
  current.fields.filter(f => f.auto).forEach(f => {
    const el = document.getElementById('fld-' + f.id), src = document.getElementById('fld-' + f.autoSrc);
    if(el && src && !el.dataset.edited) el.value = f.auto(src.value.trim());
  });
  // 表の自動計算（数量×単価）
  current.fields.filter(f => f.type === 'table').forEach(f => {
    $$(`#fld-${f.id} tbody tr`).forEach(row => {
      f.cols.filter(c => c.calc).forEach(c => {
        const ns = c.calc.map(k => toNum(row.querySelector(`[data-col="${k}"]`).value));
        row.querySelector(`[data-col="${c.id}"]`).value = ns.every(n => n !== null) ? Math.round(ns.reduce((a, b) => a * b, 1)) : '';
      });
    });
  });
  vals = {};
  current.fields.forEach(f => { if(f.id) vals[f.id] = readValue(f); });
  current.fields.forEach(f => {
    if(!f.id) return;
    const box = document.querySelector(`.field[data-fid="${f.id}"]`);
    box.classList.toggle('hidden', !isShown(f));
    const nm = 'fld-' + f.id, v = vals[f.id];
    if(f.type === 'table' && f.total) document.getElementById(nm + '-total').textContent = '合計 ' + yenStr(tableTotal(f, v));
    if(f.type === 'drange' && f.days){ const n = daysOf(v[0], v[1]); document.getElementById(nm + '-c').textContent = n ? `（${n}日間）` : ''; }
    if(f.type === 'trange' && f.hours){ const m = minsOf(v[0], v[1]); document.getElementById(nm + '-c').textContent = m != null ? `（${hm(m)}）` : ''; }
    if(f.type === 'sum') document.getElementById(nm).textContent = yenStr(sumOf(f));
  });
}

function validate(){
  let first = null;
  $$('.field.invalid').forEach(e => e.classList.remove('invalid'));
  const ng = (fid, msg) => {
    const el = document.querySelector(`.field[data-fid="${fid}"]`);
    el.classList.add('invalid');
    const m = el.querySelector('.errmsg'); if(m) m.textContent = msg;
    first = first || el;
  };
  const ap = readAp();
  if(!ap.date) ng('_date', '入力してください');
  if(!ap.name) ng('_name', '入力してください');
  current.fields.forEach(f => {
    if(!f.id || f.type === 'sum' || !isShown(f)) return;
    const v = vals[f.id];
    if(f.req && isEmpty(f, v)){
      ng(f.id, f.type === 'common' ? '共通部分のファイルを読み込んでください' : f.type === 'table' ? '1行以上入力してください' : (['select','radio','checks'].includes(f.type) ? '選択してください' : '入力してください'));
    } else if(f.type === 'drange' && v[0] && v[1] && v[1] < v[0]){
      ng(f.id, '終了日が開始日より前になっています');
    }
  });
  if(first){
    first.scrollIntoView({behavior:'smooth', block:'center'});
    toast('入力されていない必須項目があります');
    return false;
  }
  return true;
}

/* ---------- PDF（印刷用）の作成 ---------- */
function dispValue(f, v){
  switch(f.type){
    case 'date': return esc(fmtDate(v));
    case 'datetime': return esc(fmtDT(v));
    case 'month': return esc(fmtMonth(v));
    case 'number': return v !== '' ? esc(v + (f.unit || '')) : '';
    case 'yen': return v !== '' ? esc(yenStr(toNum(v) || 0)) : '';
    case 'textarea': return `<div class="pre">${esc(v)}</div>`;
    case 'radio': return f.opts.map(o => (o === v ? '■' : '□') + esc(o)).join('　');
    case 'checks': return f.opts.map(o => (v.includes(o) ? '■' : '□') + esc(o)).join('　');
    case 'drange': {
      if(!v[0]) return '';
      let s = fmtDate(v[0]);
      if(v[1] && v[1] !== v[0]) s += ' 〜 ' + fmtDate(v[1]);
      if(f.days){ const n = daysOf(v[0], v[1]); if(n) s += `（${n}日間）`; }
      return esc(s);
    }
    case 'trange': {
      if(!v[0]) return '';
      let s = v[0] + (v[1] ? ' 〜 ' + v[1] : '');
      if(f.hours){ const m = minsOf(v[0], v[1]); if(m != null) s += `（${hm(m)}）`; }
      return esc(s);
    }
    case 'sum': return `<b>${esc(yenStr(sumOf(f)))}</b>`;
    case 'table': {
      if(!v.length) return '';
      const cell = (c, x) => {
        if(x === '') return '';
        if(c.type === 'date') return esc(fmtDate(x, true));
        if(c.type === 'yen') return esc(Number(toNum(x) || 0).toLocaleString('ja-JP'));
        return esc(x);
      };
      let s = `<table class="p-inner"><thead><tr>${f.cols.map(c => `<th${c.w ? ` style="width:${c.w}"` : ''}>${esc(c.label)}</th>`).join('')}</tr></thead><tbody>`;
      s += v.map(r => `<tr>${f.cols.map(c => `<td${c.type === 'yen' || c.type === 'number' ? ' class="r"' : ''}>${cell(c, r[c.id])}</td>`).join('')}</tr>`).join('');
      if(f.total) s += `<tr class="tot"><td colspan="${f.cols.length - 1}" class="r">合計</td><td class="r">${Number(tableTotal(f, v)).toLocaleString('ja-JP')}</td></tr>`;
      return s + '</tbody></table>';
    }
    default: return esc(v);
  }
}

const fmtDateJ = s => fmtDate(s).replace(/（.）$/, '');
/* お便り（紙面形式）：上に施設名の楕円、左に今月の予定、右にご挨拶、下に利用者様の様子 */
function buildLetter(){
  const v = vals, c = COMMON || {}, ap = readAp();
  const mon = monthNum(c.month);
  const lines = (c.schedule || '').split(/\n/).map(s => s.trim()).filter(Boolean);
  const imgs = (ph, cls) => (ph && ph.length) ? `<div class="${cls}">${ph.map((src, i) => `<img src="${src}" alt="写真${i+1}">`).join('')}</div>` : '';
  const greet = [c.season, c.greet, c.closing].filter(Boolean).join('');
  let body = esc(v.life || '');
  if(v.health) body += (body ? '\n' : '') + `<span class="hd">【健康・体調】</span>` + esc(v.health);
  const extra = (label, s) => s ? `<div class="nl-extra"><div class="nl-lbl pop">${esc(label)}</div><div class="nl-box">${esc(s)}</div></div>` : '';
  $('#print').innerHTML = `
    <div class="nl">
      <div class="nl-head">
        <div class="nl-oval">
          <img class="nl-logo" src="${LOGO}" alt="グループホーム ひだまり">
          ${ap.dept ? `<div class="nl-unit pop">${esc(ap.dept)}</div>` : ''}
        </div>
        <div class="nl-dt">${esc(fmtDateJ(ap.date))}${c.issue ? `<br>第${esc(c.issue)}号` : ''}</div>
      </div>
      <div class="nl-mid">
        <div>
          <div class="nl-lbl pop">今月の予定</div>
          <div class="nl-box">
            ${mon ? `<div class="nl-mon pop">${mon}月</div>` : ''}
            <ul class="nl-sched">${lines.map(s => `<li>${esc(s)}</li>`).join('')}</ul>
            ${c.level ? `<div class="nl-level">現在の施設警戒レベルは<b>${esc(c.level)}</b>です</div>` : ''}
          </div>
          ${imgs(c.illust, 'nl-ill')}
        </div>
        <div class="nl-box nl-greet"><div class="ruled">${esc(greet)}</div></div>
      </div>
      <div class="nl-user">
        <div class="nl-lbl">利用者様の様子</div>
        <div class="nl-to"><span>${esc(v.user)}</span>様</div>
        <div class="ruled">${body}</div>
        ${imgs(v.photos, 'nl-photos')}
        <div class="nl-tanto">担当<span>${esc(ap.name)}</span></div>
      </div>
      ${extra('今月の行事', c.event)}${imgs(c.eventPhotos, 'nl-photos')}
      ${extra('来月の予定', c.next)}${extra('ご家族へのお知らせ・お願い', c.notice)}
    </div>`;
}

function buildPrint(){
  if(!current) return;
  update();
  if(current.letter){ buildLetter(); return; }
  const f = current, ap = readAp();
  let rows = '';
  f.fields.forEach(x => {
    if(x.type === 'h'){ rows += `<tr class="p-sec"><th colspan="2">${esc(x.label)}</th></tr>`; return; }
    if(!isShown(x) || x.type === 'common' || x.type === 'photos') return;
    rows += `<tr><th>${esc(x.label)}</th><td>${dispValue(x, vals[x.id])}</td></tr>`;
  });
  let stamp = '';
  if(settings.stamp){
    const labels = (settings.stampLabels || '').split(/[,、，]/).map(s => s.trim()).filter(Boolean);
    if(labels.length) stamp = `<div class="p-stamp"><table><tr>${labels.map(l => `<th>${esc(l)}</th>`).join('')}</tr><tr>${labels.map(() => '<td></td>').join('')}</tr></table></div>`;
  }
  const n = new Date();
  const made = `${n.getFullYear()}/${n.getMonth()+1}/${n.getDate()} ${pad(n.getHours())}:${pad(n.getMinutes())}`;
  $('#print').innerHTML = `
    <div class="p-top"><span>様式No.${f.no}${f.route ? '　承認ルート：' + esc(f.route) : ''}</span><span>${esc(f.dateLabel)}：${esc(fmtDate(ap.date))}</span></div>
    <div class="p-title">${esc(f.title)}</div>
    <div class="p-office">${esc(officeName())}</div>
    ${stamp}
    <table class="p-ap"><colgroup><col style="width:11%"><col style="width:26%"><col style="width:9%"><col style="width:20%"><col style="width:11%"><col></colgroup>
      <tr><th>所属</th><td>${esc(ap.dept)}</td><th>職種</th><td>${esc(ap.role)}</td><th>${esc(f.apLabel)}</th><td>${esc(ap.name)}</td></tr>
    </table>
    <table class="p-body"><colgroup><col style="width:26%"><col></colgroup>${rows}</table>
    <div class="p-foot"><span>本書はケアコネの承認申請に添付するために作成されたものです。</span><span>作成：${made}／申請書作成ツール v${VERSION}</span></div>`;
}

function fileName(){
  const ap = readAp();
  if(current.letter){
    const m = /^(\d{4})-(\d{2})$/.exec((COMMON && COMMON.month) || '');
    return `${m ? m[1] + '年' + Number(m[2]) + '月' : ''}_お便り_${vals.user || ''}様`.replace(/[\\/:*?"<>|\s]/g, '');
  }
  const ymd = (ap.date || today()).replace(/-/g, '');
  return `${ymd}_${current.title}_${ap.name || '氏名未入力'}`.replace(/[\\/:*?"<>|\s]/g, '');
}

const BASE_TITLE = document.title;
function doPrint(){
  buildPrint();
  document.title = fileName();
  setTimeout(() => window.print(), 60);
}
window.addEventListener('beforeprint', () => { if(current){ buildPrint(); document.title = fileName(); } });
window.addEventListener('afterprint', () => { document.title = BASE_TITLE; });

/* ---------- イベント ---------- */
$('#view').addEventListener('input', onEdit);
$('#view').addEventListener('change', onEdit);
function onEdit(e){
  if(!current) return;
  if(e.target.id === 'commonMonth'){
    if(e.type === 'change' && current.letter) loadServerCommon(e.target.value);
    return;
  }
  if(e.target.type === 'file'){
    if(e.type === 'change') (e.target.id === 'commonFile' ? loadCommon : addPhotos)(e.target);
    return;
  }
  if(e.type === 'input' && e.target.id && e.target.closest('#form')){
    if(e.target.value) e.target.dataset.edited = '1'; else delete e.target.dataset.edited;
  }
  if(e.target.id && e.target.id.startsWith('ap-')){
    const ap = readAp(); LS.set('shinsei.applicant', {dept:ap.dept, role:ap.role, name:ap.name});
  } else if(e.target.closest('#form')) dirty = true;
  const box = e.target.closest('.field.invalid'); if(box) box.classList.remove('invalid');
  update();
}
$('#view').addEventListener('click', e => {
  if(e.target.id === 'back' && dirty){
    e.preventDefault();
    ask('入力した内容は保存されません。一覧に戻りますか？', '一覧に戻る').then(ok => { if(ok){ dirty = false; location.hash = ''; renderHome(); } });
    return;
  }
  const add = e.target.closest('.addrow');
  if(add){ addRow(FORMS[current.id].fields.find(x => x.id === add.dataset.t)); update(); return; }
  if(e.target.id === 'loadCommon'){ $('#commonFile').click(); return; }
  if(e.target.id === 'openCommonMonth'){ loadServerCommon($('#commonMonth').value); return; }
  const pd = e.target.closest('.phdel');
  if(pd){
    const f = current.fields.find(x => x.id === pd.dataset.ph);
    PHOTOS[f.id].splice(Number(pd.dataset.i), 1);
    dirty = true; renderPhotos(f); update(); return;
  }
  const del = e.target.closest('.del');
  if(del){
    const tb = del.closest('tbody'); del.closest('tr').remove();
    if(!tb.children.length){ const fid = tb.closest('table').id.slice(4); addRow(current.fields.find(x => x.id === fid)); }
    dirty = true; update();
  }
});

$('#btnPdf').addEventListener('click', () => {
  if(!current) return;
  if(current.saveCommon){ saveCommon(); return; }
  update();
  if(!validate()) return;
  if(IN_FRAME){
    toast('この画面は確認用のため、PDFは作成できません。配布用のファイルを開いて作成してください。', 5000);
    return;
  }
  if(settings.guide || IS_PHONE){
    $('#gName').textContent = fileName() + '.pdf';
    if(IS_IOS){
      $('#gStep1').innerHTML = '印刷画面の右上の<b>共有ボタン</b>（□に↑のマーク）を押す';
      $('#gStep2').innerHTML = '<b>「“ファイル”に保存」</b>を選んで保存する（ファイル名が違っても問題ありません）';
    } else if(IS_ANDROID){
      $('#gStep1').innerHTML = '画面上の「プリンタを選択」で <b>「PDF形式で保存」</b>を選ぶ';
      $('#gStep2').innerHTML = '<b>PDFのボタン</b>を押して保存する（「ダウンロード」に保存されます）';
    }
    $('#gStep3').innerHTML = current.letter
      ? '内容を確認し、保存したPDFを<b>ご家族へ送信</b>する'
      : `保存したPDFを<b>ケアコネに送信</b>し、その投稿を<b>ロングタップ</b>→<b>「承認申請」</b>から、承認ルート<b>「${esc(current.route || '')}」</b>を選んで申請する`;
    $('#gHide').checked = false;
    $('#mGuide').classList.remove('hidden');
    $('#gGo').focus();
  } else doPrint();
});
$('#gGo').addEventListener('click', () => {
  if($('#gHide').checked){ settings.guide = false; LS.set('shinsei.settings', settings); }
  $('#mGuide').classList.add('hidden');
  doPrint();
});
$('#btnClear').addEventListener('click', () => {
  const msg = current.letter
    ? 'ご利用者様ごとの内容を消去します（読み込んだ共通部分はそのまま残ります）。よろしいですか？'
    : '入力した内容をすべて消去します。よろしいですか？';
  ask(msg, '消去する').then(ok => { if(ok) openForm(current); });
});

$('#openSettings').addEventListener('click', () => {
  $('#sOffice').value = settings.office || OFFICE_NAME;
  $('#sStamp').checked = !!settings.stamp;
  $('#sStampLabels').value = settings.stampLabels || '';
  $('#sGuide').checked = !!settings.guide;
  $('#mSettings').classList.remove('hidden');
  $('#sOffice').focus();
});
$('#saveSettings').addEventListener('click', () => {
  settings.office = $('#sOffice').value.trim();
  settings.stamp = $('#sStamp').checked;
  settings.stampLabels = $('#sStampLabels').value.trim();
  settings.guide = $('#sGuide').checked;
  LS.set('shinsei.settings', settings);
  $('#mSettings').classList.add('hidden');
  refreshOffice();
  toast('設定を保存しました');
});
document.addEventListener('click', e => {
  const c = e.target.closest('[data-close]'); if(c) document.getElementById(c.dataset.close).classList.add('hidden');
  if(e.target.classList.contains('modal')) e.target.classList.add('hidden');
});
document.addEventListener('keydown', e => { if(e.key === 'Escape') $$('.modal').forEach(m => m.classList.add('hidden')); });
window.addEventListener('beforeunload', e => { if(dirty){ e.preventDefault(); e.returnValue = ''; } });

async function route(){
  const id = decodeURIComponent(location.hash.replace(/^#\/?/, ''));
  const f = FORMS[id];
  // 管理者ページ：事務所PC版は管理者のPCだけ、ネット版は「…/#otayoriCommon」を開いて暗証番号を入れたときだけ
  if(!f || (f.saveCommon && !IS_ADMIN && BACKEND !== 'cloud')){ renderHome(); return; }
  if(f.saveCommon && !(await unlockAdmin())){ location.hash = ''; renderHome(); return; }
  openForm(f);
}
window.addEventListener('hashchange', route);
refreshOffice();
checkServer().then(route);
// ネット版：電波が弱いところでも開けるように、画面をスマホに保存しておく
if('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
